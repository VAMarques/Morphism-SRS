[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morphism-srs"
version = "0.2.2"
description = "Morphism SRS Prototype 2 — Mathematical Spaced Repetition System with DAG Prerequisite Graphs, Sequential Proofs, Holistic Cloze, and Zero-Lag Offline MathJax"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "cryptography>=42",
    "PySide6>=6.6.0",
    "fsrs>=5.1.3,<6",
    "platformdirs>=4.0.0",
]

[project.scripts]
morphism-srs = "morphism_srs.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
morphism_srs = [
    "storage/*.sql",
    "resources/**/*",
]
