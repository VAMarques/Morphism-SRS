<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Review Heatmap</title>
    <link rel="stylesheet" href="morphism://app/css/cards.css">
    <style>
        .heatmap-wrap { padding: 12px 16px; }
        .heatmap-grid {
            display: grid;
            grid-template-rows: repeat(7, 13px);
            grid-auto-flow: column;
            grid-auto-columns: 13px;
            gap: 3px;
            overflow-x: auto;
            padding-bottom: 6px;
        }
        .hm-cell {
            width: 13px;
            height: 13px;
            border-radius: 3px;
            background-color: var(--bg-surface-0);
        }
        .hm-lv1 { background-color: #3b5bdb; }
        .hm-lv2 { background-color: #4dabf7; }
        .hm-lv3 { background-color: var(--accent-primary); }
        .hm-lv4 { background-color: var(--semantic-success); }
        .hm-summary { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="heatmap-wrap">
        <div id="hm-summary" class="hm-summary">Activity over the last 365 days</div>
        <div id="hm-grid" class="heatmap-grid"></div>
    </div>
    <script src="morphism://app/js/stats_charts.js"></script>
</body>
</html>
