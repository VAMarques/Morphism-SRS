<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Statistics Charts</title>
    <link rel="stylesheet" href="morphism://app/css/cards.css">
    <script src="morphism://app/vendor/chartjs/chart.umd.min.js"></script>
    <style>
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 12px 16px;
        }
        .chart-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 12px;
            height: 240px;
        }
    </style>
</head>
<body>
    <div class="charts-row">
        <div class="chart-card">
            <canvas id="forecast-canvas"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="ratings-canvas"></canvas>
        </div>
    </div>
    <script src="morphism://app/js/stats_charts.js"></script>
</body>
</html>
